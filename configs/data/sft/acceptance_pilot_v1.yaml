schema_version: 1
name: minimind-sft-v1-8m-pilot-acceptance
status: frozen_before_build
data_config: configs/data/sft/build_pilot_v1.yaml
source_config: configs/data/sft/sources_v1.yaml
contamination_config: configs/data/sft/contamination_v1.yaml
tokenizer: tokenizer
sequence_length: 768
seed: 42

budgets:
  unit: shifted_assistant_loss_target_tokens
  train: 8000000
  validation: 40000
  test: 40000
  bucket_weights:
    chinese_general: 0.30
    english_general: 0.17
    multiturn: 0.15
    strict_format: 0.08
    math: 0.10
    tool_call: 0.10
    summarization_translation: 0.05
    code: 0.05
  maximum_overshoot: less_than_one_selected_complete_record

schema_and_loader_gate:
  top_level_keys_exact: [conversations]
  message_keys_exact: [role, content, reasoning_content, tools, tool_calls]
  allowed_roles: [system, user, assistant, tool]
  invalid_json_max: 0
  invalid_conversation_max: 0
  zero_shifted_assistant_target_rows_max: 0
  non_assistant_supervised_tokens_max: 0
  assistant_eos_unsupervised_max: 0
  trainer_loader: minimind.dataset.lm_dataset.SFTDataset
  trainer_augmentation: false

complete_turn_gate:
  truncation_policy: complete_turn_only
  truncated_mid_message_max: 0
  incomplete_assistant_eos_max: 0
  partial_tool_exchange_max: 0

dedup_and_split_gate:
  exact_conversation_duplicate_rate_max: 0.0
  exact_user_prompt_overlap_across_splits_max: 0
  near_user_prompt_overlap_across_splits_max: 0
  near_char_ngram: 5
  near_jaccard_threshold: 0.85
  one_origin_per_bucket_and_split: true
  trainer_resplit_allowed: false

contamination_gate:
  scan_scope: full_final_train_validation_test
  exact_overlap_max: 0
  containment_overlap_max: 0
  near_overlap_max: 0
  fixed_evaluation_sets:
    - ceval-valid
    - cmmlu-test
    - arc-easy-test
    - openbookqa-test
    - hellaswag-validation
    - piqa-validation
    - social-iqa-validation
    - gsm8k-test
    - mbpp-test

source_and_provenance_gate:
  require_40_char_source_revision: true
  require_declared_license: true
  require_raw_rows_bytes_sha256: true
  provenance_storage: sidecar_only
  origin_reuse_max: 0

derived_quality_gate:
  strict_format:
    projection_counts_as_capacity: false
    actual_materialized_unique_capacity_required: true
    unsupported_constraint_counts_as_capacity: false
    verifier_failures_max: 0
    minimum_verified_transform_families: 10
    replay_verifier_in_independent_auditor: true
  math:
    bucket_target_tokens: 800000
    high_confidence_reasoning_final_only_for_numina: true
    excluded_numina_source_tags: [gsm8k, math]
  tool_call:
    bucket_target_tokens: 800000
    complete_tool_exchange_only: true

finalization_gate:
  builder_status: pending_external_audit
  independent_auditor_required: true
  marker: _SUCCESS
  marker_status: accepted
  bind_config_source_tokenizer_builder_auditor_sha: true
  bind_split_rows_bytes_sha256_tokens_bucket_mix: true
  bind_eval_reference_prompt_builder_and_harness_sha: true
