name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public repository boundary and links
        run: python3 scripts/check_repository.py
      - name: Compile Python sources
        run: python3 -m compileall -q mica.py model dataset trainer evaluation inference scripts tests

  mica-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: mica train --recipe configs/smoke/cpu.json --output outputs/smoke
      - run: mica evaluate --model outputs/smoke --data examples/tokens.jsonl
