name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public repository boundary and links
        run: python3 scripts/check_repository.py
      - name: Compile Python sources
        run: python3 -m compileall -q scripts minimind/model minimind/trainer
