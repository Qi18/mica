name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public repository boundary and links
        run: python3 .github/check_repository.py
      - name: Compile Python sources
        run: python3 -m compileall -q mica.py model dataset trainer evaluation inference tests

  mica-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
