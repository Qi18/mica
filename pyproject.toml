[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica-llm"
version = "0.2.0"
description = "Mica language models: training, evaluation and inference"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<2.7", "transformers>=4.51,<4.52"]

[project.optional-dependencies]
serve = ["Flask>=3,<4"]

[project.scripts]
mica = "mica_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["NOTICE", "minimind/LICENSE"]
